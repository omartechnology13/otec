<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omar technology</title>
    <script src="https://kit.fontawesome.com/5ff3848849.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      background: #000000;
      font-family: Arial;
    }

    #loader {
      position: fixed;
      width: 100%;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;

      opacity: 1;
      transition: opacity 0.8s ease;
    }

    #loader.fade-out {
      opacity: 0;
      background: linear-gradient(to bottom, #000 0%, transparent 100%);
    }

    .logo {
      width: 120px;
      margin-bottom: 20px;
    }

    .progress-bar {
      width: 220px;
      height: 5px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: #ffffff;
      animation: load 2s linear forwards;
    }

    @keyframes load {
      to {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div id="loader">
    <img src="logo.png" class="logo" alt="logo">

    <div class="progress-bar">
      <div class="progress"></div>
    </div>
  </div>

  <script>
    // 1️⃣ استنى تحميل الشكل
    setTimeout(function () {

      const loader = document.getElementById("loader");

      // 2️⃣ Fade + Gradient اختفاء
      loader.classList.add("fade-out");


      setTimeout(function () {
        window.location.href = "homepage.html";
      }, 800);

    }, 2500); 
  </script>

</body>
</html>
